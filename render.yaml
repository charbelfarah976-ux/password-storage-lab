services:
  - type: web
    name: password-storage-lab
    runtime: python
    plan: free
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: PASSWORD_LAB_DATABASE
        value: /tmp/password_lab.sqlite3
      - key: PASSWORD_LAB_PUBLIC_DEMO
        value: "true"
